server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El front llama a /api/v1 con ruta relativa: nginx lo reenvía al backend,
  # igual que el proxy de Vite en desarrollo. Así no hace falta CORS.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier otra ruta la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
